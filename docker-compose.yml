version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: paygate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-paygate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paygate_secret_change_me}
      POSTGRES_DB: ${DB_NAME:-paygate_omni}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-paygate} -d ${DB_NAME:-paygate_omni}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: paygate_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: paygate_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-paygate}
      DB_PASSWORD: ${DB_PASSWORD:-paygate_secret_change_me}
      DB_NAME: ${DB_NAME:-paygate_omni}
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY must be set to exactly 32 bytes}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
